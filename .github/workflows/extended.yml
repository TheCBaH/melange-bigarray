name: extended
on:
  schedule:
    - cron: '19 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        run: echo "versions=$(python3 tools/extended_matrix.py)" >> "$GITHUB_OUTPUT"
  stress:
    needs: matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.versions) }}
    env:
      OCAML_VERSION: ${{ matrix.ocaml }}
      MELANGE_VERSION: ${{ matrix.melange }}
      BROWSER_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v7
      - uses: TheCBaH/devcontainer-action/devcontainer@v1
        id: container
        with:
          variant: ${{ matrix.ocaml }}
          username: ${{ github.actor }}
          password: ''
      - name: Extended independent traces
        run: ${{ steps.container.outputs.exec }} env BROWSER_ENGINE=${{ matrix.engine }} EXTENDED_TRACE_ONLY=1 make deps oracle.prepare test.stress tree.check
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: extended-${{ matrix.ocaml }}-${{ matrix.runner }}-${{ matrix.engine }}
          path: .cache/reports/
          if-no-files-found: error
